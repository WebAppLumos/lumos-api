spring.application.name=lumos-api

# Firebase Admin SDK (lumos-api 루트의 firebase-service-account.json)
firebase.service-account.path=firebase-service-account.json

# PostgreSQL 연결 (하드코딩)
spring.datasource.url=jdbc:postgresql://ep-autumn-mouse-ao51pabx-pooler.c-2.ap-southeast-1.aws.neon.tech/lumos_db?sslmode=require&channel_binding=require&prepareThreshold=0
spring.datasource.username=lumos
spring.datasource.password=npg_owC70iYXpsWA
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 설정 (스키마는 Flyway가 관리, Hibernate는 검증만)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway 설정
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# 파일 및 요청 크기 제한 확대 (Base64 업로드 대응)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB
