spring.application.name=lumos-api

# 로컬: lumos-api/.env 파일 사용 (bootRun 시 자동 로드)
# 배포: GitHub Secrets / 호스트 환경 변수로 주입
spring.config.import=optional:file:.env[.properties]

# Firebase Admin SDK — FIREBASE_SERVICE_ACCOUNT_JSON 환경 변수 사용 (배포/로컬 .env)

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (스키마는 Flyway가 관리)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# 파일 및 요청 크기 제한 (Base64 업로드 대응)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Render 등 PaaS는 PORT 환경 변수 사용
server.port=${PORT:8080}

# Vercel 프론트 도메인 등 (쉼표 구분, 와일드카드 지원)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://edward.kmu.ac.kr,chrome-extension://*}
